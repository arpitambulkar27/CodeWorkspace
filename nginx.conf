# Production NGINX Configuration for CodeFlow
# Upstream Express + Socket.io Load Balancing with Sticky Sessions

upstream codeflow_backend {
    ip_hash; # Sticky sessions required for Socket.io WebSockets
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name _; # Change to your domain (e.g. codeflow.dev)

    client_max_body_size 20M;

    # 1. Serve React Frontend Static Build
    location / {
        root /var/www/codeflow/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Express REST API Requests
    location /api/ {
        proxy_pass http://codeflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy Socket.io WebSockets (Live Multiplayer Editor Sync)
    location /socket.io/ {
        proxy_pass http://codeflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
